services:
  - type: web
    name: edu-discover-api
    env: node
    repo: https://github.com/shivendra9838/Collegefinder.git
    rootDir: artifacts/api-server
    buildCommand: pnpm run build
    startCommand: pnpm run start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
